name: ci

# Lint and tests on a self-hosted runner (label `vaca-muerta`). CI has no warehouse: the claims test checks the
# numbers that come from committed files and skips the rest. The full verification against the warehouse
# (`python -m pipeline.claims`) runs with the data refresh, ./refresh.sh, from a network that reaches
# datos.energia.gob.ar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check pipeline agente tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q
