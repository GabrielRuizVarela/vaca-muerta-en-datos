name: ci

# GitHub-hosted minutes are blocked by billing on this account (2026-11-17), so both jobs run on the
# self-hosted runner of the owner's machine (label `vaca-muerta`, service vaca-muerta-actions-runner, with a
# job-started guard that only lets this repository's ci workflow run: pull requests into main from this
# repository, pushes to main and manual runs). CI runs lint and the tests only. The data refresh runs from a machine in Argentina:
# ./refresh.sh (manual or cron). The claims test (README numbers against the warehouse) checks
# the numbers that come from committed files and skips the rest: there is no warehouse here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check pipeline agente tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q
