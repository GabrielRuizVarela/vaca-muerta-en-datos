<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-labelledby="t d">
<title id="t">Efectos plantados contra efectos recuperados</title>
<desc id="d">Dos paneles con la recta de uno a uno. A la izquierda, la brecha del mes 1 recuperada contra la plantada, en puntos del índice, con la media de 30 mundos simulados y el rango del 5% al 95%. A la derecha, la pendiente del mes 0 sobre la fracción del mes. Lo recuperado es la diferencia con el mundo nulo de los mismos sorteos y lo plantado está en puntos del índice. Los puntos cerca de la recta dicen que el estimador sin cambios recupera lo plantado. Recuperar un efecto plantado dice algo del método, no de los pozos.</desc>
