<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 660" width="700" height="660" role="img" aria-labelledby="t d">
<title id="t">Brecha de petróleo por mes desde la fractura del hijo</title>
<desc id="d">Brecha del petróleo entre los padres a menos de 1 km y los controles de la misma edad, por mes desde la fractura del pozo hijo, en puntos del índice. La brecha cae en el mes 1 a -23,0 puntos, ya era negativa antes de la fractura y casi se cierra a los 6 meses. Medida, no causa.</desc>
