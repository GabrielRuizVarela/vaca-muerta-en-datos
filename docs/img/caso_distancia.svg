<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 362" width="700" height="362" role="img" aria-labelledby="t d">
<title id="t">Brecha del mes 1 por distancia al pozo hijo</title>
<desc id="d">Brecha del petróleo al mes 1 por banda de distancia al hijo más cercano, contra el anillo de 5 a 10 km. La brecha cambia de forma gradual con la distancia y no corta en un punto; el anillo de 5 a 10 km rinde 2,8 puntos más que el control de 2 a 5 km, que no es un cero limpio.</desc>
