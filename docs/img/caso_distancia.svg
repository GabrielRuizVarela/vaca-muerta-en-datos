.titulo { font-size: 15px; font-weight: bold; }
.sub { fill: #6b6b6b; }
.eje { stroke: #222222; stroke-width: 1; fill: none; }
.rejilla { stroke: #e4e4e4; stroke-width: 1; }
.cero { stroke: #222222; stroke-width: 1.2; }
.marca { stroke: #6b6b6b; stroke-width: 1; stroke-dasharray: 4 3; }
.banda { fill: #f0e442; fill-opacity: 0.25; }
.pie { fill: #6b6b6b; font-size: 10px; }</style>
